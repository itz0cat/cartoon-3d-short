name: Render

# How to start a render (works from a phone, no big files):
#   - Actions tab -> Render -> Run workflow (smoke = true renders only 30 frames), or
#   - push a commit whose message contains [smoke] (30 frames) or [render] (full video).
# Settings live in render.config.json: composition, totalFrames (1200 = 40 s @ 30 fps), chunks, release.

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Smoke test: render only the first 30 frames"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[render]') || contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      composition: ${{ steps.p.outputs.composition }}
      release: ${{ steps.p.outputs.release }}
      smoke: ${{ steps.p.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SMOKE: ${{ inputs.smoke }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          c = json.load(open("render.config.json"))
          smoke = (os.environ["EVENT"] == "workflow_dispatch" and os.environ["INPUT_SMOKE"] == "true") or "[smoke]" in os.environ.get("MSG", "")
          total = int(c["totalFrames"])
          n = max(1, int(c.get("chunks", 4)))
          if smoke:
              total, n = min(30, total), 1
          size = -(-total // n)
          inc = []
          for i in range(n):
              a = i * size
              b = min(total - 1, (i + 1) * size - 1)
              if a <= b:
                  inc.append({"i": i, "range": f"{a}-{b}"})
          print("matrix=" + json.dumps({"include": inc}))
          print("composition=" + c["composition"])
          print("release=" + ("true" if c.get("release") and not smoke else "false"))
          print("smoke=" + ("true" if smoke else "false"))
          PY

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libatk-bridge2.0-0
      - name: Install packages
        run: |
          # after the first green run commit package-lock.json, then this uses npm ci
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Render frames ${{ matrix.range }}
        env:
          COMP: ${{ needs.plan.outputs.composition }}
          RANGE: ${{ matrix.range }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMP" "out/part-${{ matrix.i }}.mp4" \
            --codec=h264 --crf=18 --muted --gl=swangle --concurrency=2 --frames="$RANGE" --log=info
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.i }}
          path: out/part-${{ matrix.i }}.mp4
          retention-days: 1

  finish:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-numpy python3-scipy python3-pil
      - name: Join chunks
        run: |
          cd parts
          for f in $(ls part-*.mp4 | sort -V); do echo "file '$f'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../video.mp4
      - name: Build audio (only when voice files are committed)
        if: ${{ hashFiles('voice/voice.wav') != '' && hashFiles('voice/words.json') != '' }}
        run: python3 audio/mix.py
      - name: Add audio
        run: |
          if [ -f audio/mix.wav ]; then
            ffmpeg -y -i video.mp4 -i audio/mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest final.mp4
          else
            cp video.mp4 final.mp4
          fi
          ls -lh final.mp4
          echo "final.mp4: $(du -h final.mp4 | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: final.mp4
          retention-days: 30
      - name: Publish as a Release
        if: ${{ needs.plan.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "render-${{ github.run_number }}" final.mp4 --title "Render ${{ github.run_number }}" --notes "Rendered by GitHub Actions"
